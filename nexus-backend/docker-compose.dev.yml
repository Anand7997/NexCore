version: '3.9'

# Phase 1: PostgreSQL only.
# Subsequent phases add: Temporal, NATS, ClickHouse, Neo4j, Qdrant, Meilisearch, MinIO, Keycloak.

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports:
      - '5432:5432'
    volumes:
      - nexus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus -d nexus']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nexus_postgres_data:
