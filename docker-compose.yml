version: '3.8'

services:
  # ────────────────────────────────────────────────────────────────────────────
  # Core Infrastructure
  # ────────────────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: nexus-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

  temporal:
    image: temporalio/auto-setup:latest
    container_name: nexus-temporal
    ports:
      - "7233:7233"   # gRPC
      - "8233:8233"   # Temporal UI
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=nexus
      - POSTGRES_PWD=nexus
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus-network
    volumes:
      - ./infra/temporal-config:/etc/temporal/config/dynamicconfig

  nats:
    image: nats:2.10-alpine
    container_name: nexus-nats
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP monitoring
      - "6222:6222"   # Clustering
    command: ["--jetstream", "--store_dir=/data"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - nexus-network

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: nexus-qdrant
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC (optional)
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT_ALLOW_RECOVERY_MODE=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - nexus-network

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: nexus-keycloak
    command:
      - start-dev
      - --import-realm
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: nexus
      KC_DB_PASSWORD: nexus
      KC_HEALTH_ENABLED: true
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - nexus-network

  # ────────────────────────────────────────────────────────────────────────────
  # Optional: Observability Stack (Uncomment to enable)
